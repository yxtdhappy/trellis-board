<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WitOps 任务</title>
    <link rel="stylesheet" href="/plugin-ui/v1/tokens.css" />
    <link rel="stylesheet" href="/plugin-ui/v1/base.css" />
    <link rel="stylesheet" href="/plugin-ui/v1/ui.css" />
    <link rel="stylesheet" href="/api/plugins/witops-core/app/panel/app.css" />
  </head>
  <body class="team-panel">
    <header class="head">
      <div>
        <h1>WitOps 任务</h1>
        <p id="meta" class="tb-muted tb-small">加载中…</p>
      </div>
      <div class="actions">
        <span id="auth-chip" class="tb-chip">未登录</span>
        <button id="logout" class="tb-btn tb-btn-ghost tb-btn-sm" type="button" hidden>退出</button>
      </div>
    </header>

    <form id="login" class="login" hidden>
      <div class="login-title">先登录 WitOps 账号</div>
      <label
        >账号<input id="account" class="tb-input" type="text" autocomplete="username" required
      /></label>
      <label
        >密码<input
          id="password"
          class="tb-input"
          type="password"
          autocomplete="current-password"
          required
      /></label>
      <button id="login-submit" class="tb-btn" type="submit">登录</button>
      <span id="login-hint" class="tb-muted tb-small">
        账号密码只用于换取这次访问，不会保存。
      </span>
    </form>

    <div id="banner" class="error" hidden></div>

    <section id="workspace" class="team-workspace" hidden>
      <div class="team-toolbar">
        <details class="ms ms-projects" id="ms-projects">
          <summary class="tb-btn tb-btn-ghost tb-btn-sm">
            项目：<span class="ms-count" id="project-count">全部</span>
          </summary>
          <div class="ms-panel ms-panel-wide" role="group" aria-label="项目">
            <input
              id="project-search"
              class="tb-input tb-input-sm ms-search"
              type="search"
              autocomplete="off"
              placeholder="搜索项目名称或编号"
            />
            <div id="project-options" class="ms-options"></div>
            <div class="ms-actions">
              <button id="project-all" class="tb-btn tb-btn-ghost tb-btn-sm" type="button">
                全选
              </button>
              <button id="project-none" class="tb-btn tb-btn-ghost tb-btn-sm" type="button">
                清空
              </button>
            </div>
          </div>
        </details>
        <button id="reload" class="tb-btn tb-btn-ghost tb-btn-sm" type="button">刷新</button>
      </div>

      <div class="team-toolbar team-filters">
        <label class="filter-field filter-text">
          <span>编号</span>
          <input
            id="filter-code"
            class="tb-input tb-input-sm"
            type="search"
            placeholder="模糊匹配"
          />
        </label>
        <label class="filter-field filter-text">
          <span>标题</span>
          <input
            id="filter-name"
            class="tb-input tb-input-sm"
            type="search"
            placeholder="模糊匹配"
          />
        </label>
        <details class="ms" id="ms-status" data-label="状态">
          <summary class="tb-btn tb-btn-ghost tb-btn-sm">
            状态：<span class="ms-count">全部</span>
          </summary>
          <div class="ms-panel" role="group" aria-label="状态"></div>
        </details>
        <details class="ms" id="ms-priority" data-label="优先级">
          <summary class="tb-btn tb-btn-ghost tb-btn-sm">
            优先级：<span class="ms-count">全部</span>
          </summary>
          <div class="ms-panel" role="group" aria-label="优先级"></div>
        </details>
        <details class="ms" id="ms-assignee" data-label="负责人">
          <summary class="tb-btn tb-btn-ghost tb-btn-sm">
            负责人：<span class="ms-count">全部</span>
          </summary>
          <div class="ms-panel" role="group" aria-label="负责人"></div>
        </details>
        <label class="filter-field filter-iteration">
          <span>迭代</span>
          <select id="filter-iteration" class="tb-input tb-input-sm">
            <option value="">全部迭代</option>
          </select>
        </label>
        <label class="filter-field filter-date">
          <span>创建</span>
          <input id="filter-create-from" class="tb-input tb-input-sm" type="date" />
        </label>
        <label class="filter-field filter-date">
          <span>至</span>
          <input id="filter-create-to" class="tb-input tb-input-sm" type="date" />
        </label>
        <button id="filter-reset" class="tb-btn tb-btn-ghost tb-btn-sm" type="button">
          重置筛选
        </button>
      </div>

      <div id="loading" class="table-loading" role="status" aria-live="polite" hidden>
        <span class="spinner" aria-hidden="true"></span>
        <span class="loading-text">正在加载任务…</span>
      </div>

      <div class="tb-table-wrap table-wrap">
        <table class="tb-table team-table no-project" id="team-table">
          <colgroup>
            <col class="col-toggle" />
            <col class="col-code" />
            <col class="col-title" />
            <col class="col-priority" />
            <col class="col-status" />
            <col class="col-assignee" />
            <col class="col-due" />
            <col class="col-project" />
          </colgroup>
          <thead>
            <tr>
              <th class="col-toggle"><span class="visually-hidden">展开</span></th>
              <th class="col-code">编号</th>
              <th class="col-title">标题</th>
              <th class="col-priority">优先级</th>
              <th class="col-status">状态</th>
              <th class="col-assignee">负责人</th>
              <th class="col-due">截止日期</th>
              <th class="col-project">项目</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
        <p id="empty" class="tb-muted tb-small empty" hidden>这个项目暂时没有任务</p>
      </div>

      <div class="team-pager">
        <span id="hint" class="tb-muted tb-small"></span>
        <button id="prev" class="tb-btn tb-btn-ghost tb-btn-sm" type="button" disabled>
          上一页
        </button>
        <span id="page-label" class="tb-muted tb-small"></span>
        <button id="next" class="tb-btn tb-btn-ghost tb-btn-sm" type="button" disabled>
          下一页
        </button>
      </div>
    </section>

    <script src="/plugin-ui/v1/bridge.js"></script>
    <script src="/api/plugins/witops-core/app/panel/team.js"></script>
  </body>
</html>
