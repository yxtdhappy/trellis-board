<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>任务</title>
    <link rel="stylesheet" href="/api/plugins/witops-core/panel/app.css" />
  </head>
  <body>
    <header class="head">
      <div>
        <h1>任务</h1>
        <p id="meta" class="muted">加载中…</p>
      </div>
      <div class="actions">
        <span id="auth-chip" class="chip">未登录</span>
        <label class="toggle"><input id="show-requirements" type="checkbox" checked /> 需求</label>
        <label class="toggle"><input id="show-tasks" type="checkbox" checked /> 任务</label>
        <button id="sync" class="ghost" type="button">同步最近</button>
        <button id="refresh" class="ghost" type="button">刷新</button>
        <button id="logout" class="ghost" type="button" hidden>退出</button>
      </div>
    </header>

    <form id="login" class="login" hidden>
      <div class="login-title">登录 WitOps 平台</div>
      <label>账号<input id="account" type="text" autocomplete="username" required /></label>
      <label
        >密码<input id="password" type="password" autocomplete="current-password" required
      /></label>
      <label class="toggle"><input id="remember" type="checkbox" /> 记住密码</label>
      <button id="login-submit" type="submit">登录</button>
      <span id="login-hint" class="muted">密码默认不落盘；勾选记住密码后用宿主密钥加密保存。</span>
    </form>

    <div id="error" class="error" hidden></div>
    <div id="notice" class="notice" hidden></div>

    <div class="bulk">
      <label class="toggle"><input id="select-all" type="checkbox" /> 全选</label>
      <button id="dispatch-selected" type="button" disabled>批量创建</button>
      <span id="selected-count" class="muted">未选择</span>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th class="pick"></th>
            <th>编号</th>
            <th>标题</th>
            <th>状态</th>
            <th>截止日期</th>
            <th>负责人</th>
            <th class="story">需求</th>
            <th class="trellis">Trellis</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
      <p id="empty" class="empty" hidden>暂无任务</p>
    </div>
    <div id="dialog" class="dialog" hidden>
      <form class="dialog-card" id="dialog-form">
        <h2 id="dialog-title">创建任务</h2>
        <p id="dialog-hint" class="muted"></p>
        <label class="field">
          <span>项目</span>
          <select id="dialog-project"></select>
        </label>
        <label class="field">
          <span>截止日期</span>
          <input
            id="dialog-due"
            type="text"
            placeholder="YYYY-MM-DD"
            maxlength="10"
            autocomplete="off"
            inputmode="numeric"
          />
        </label>
        <div class="dialog-actions">
          <button id="dialog-cancel" type="button" class="ghost">取消</button>
          <button id="dialog-confirm" type="submit">确认创建</button>
        </div>
      </form>
    </div>
    <script src="/api/plugins/witops-core/panel/app.js"></script>
  </body>
</html>
