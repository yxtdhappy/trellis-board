<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Jenkins 构建</title>
    <link rel="stylesheet" href="/api/plugins/jenkins-ops/panel/app.css" />
  </head>
  <body>
    <div class="layout">
      <aside class="sidebar">
        <div class="sidebar-head">
          <strong>Jenkins</strong>
          <span id="conn" class="badge">未配置</span>
        </div>
        <div class="search-row">
          <input id="search" type="search" placeholder="过滤 job，支持 * 通配" autocomplete="off" />
          <button id="refresh-jobs" class="ghost" type="button" title="刷新列表">↻</button>
        </div>
        <ul id="jobs" class="job-list"></ul>
        <div id="jobs-empty" class="empty muted" hidden></div>
        <div id="credentials" class="credential-slot"></div>
      </aside>

      <section class="detail">
        <header class="detail-head">
          <div class="head-title">
            <h1 id="job-title">选择一个 job</h1>
            <p id="job-meta" class="muted"></p>
          </div>
          <div class="head-actions">
            <button id="show-queue" class="ghost" type="button">队列</button>
            <button id="show-settings" class="ghost" type="button">设置</button>
          </div>
        </header>
        <div id="job-body" class="job-body">
          <div class="empty muted">左侧选择 job，可触发构建、查看状态、读取日志与产物。</div>
        </div>
      </section>
    </div>

    <dialog id="settings-dialog" class="dialog">
      <form method="dialog" class="dialog-body">
        <h2>连接设置</h2>
        <label>
          Jenkins 地址
          <input id="set-base-url" type="url" placeholder="https://jenkins.example.com" />
        </label>
        <label>
          用户名
          <input id="set-username" type="text" placeholder="bot" autocomplete="off" />
        </label>
        <label>
          密码
          <input
            id="set-password"
            type="password"
            placeholder="留空表示不修改"
            autocomplete="off"
          />
        </label>
        <label class="inline">
          <input id="set-verify-tls" type="checkbox" />
          校验 TLS 证书（内网自签证书可关闭）
        </label>
        <label>
          默认 job 过滤（逗号分隔，可留空）
          <input id="set-filter" type="text" placeholder="deploy-*,release/*" />
        </label>
        <label>
          只列这些视图（逗号分隔，留空表示全部 job）
          <input id="set-views" type="text" placeholder="标品MOM3-DEV, 标品MOM3-FAT" />
        </label>
        <p id="settings-hint" class="muted"></p>
        <div class="dialog-actions">
          <button id="clear-password" class="ghost danger" type="button">清除密码</button>
          <span class="grow"></span>
          <button class="ghost" value="cancel" type="submit" formmethod="dialog">取消</button>
          <button id="save-settings" type="button">保存</button>
        </div>
      </form>
    </dialog>

    <dialog id="log-dialog" class="dialog wide">
      <div class="dialog-body">
        <h2 id="log-title">控制台输出</h2>
        <pre id="log-body" class="log"></pre>
        <div class="dialog-actions">
          <span id="log-hint" class="muted grow"></span>
          <button class="ghost" type="button" data-close>关闭</button>
        </div>
      </div>
    </dialog>

    <dialog id="queue-dialog" class="dialog wide">
      <div class="dialog-body">
        <h2>构建队列</h2>
        <div id="queue-body" class="queue"></div>
        <div class="dialog-actions">
          <span class="grow"></span>
          <button class="ghost" type="button" data-close>关闭</button>
        </div>
      </div>
    </dialog>

    <div id="toast" class="toast" hidden></div>
    <script src="/plugin-ui/combo.js"></script>
    <script src="/api/plugins/accounts-core/panel/widget/credentials-widget.js"></script>
    <script src="/api/plugins/jenkins-ops/panel/app.js"></script>
  </body>
</html>
