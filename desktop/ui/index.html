<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Trellis Board 登录</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="shell">
      <section id="env-panel" class="card" aria-labelledby="env-title" hidden>
        <div class="brand">
          <span class="mark" aria-hidden="true">T</span>
          <div>
            <p class="eyebrow">TRELLIS DESKTOP</p>
            <h1 id="env-title">首次启动环境检查</h1>
          </div>
        </div>
        <p id="env-status" class="status" role="status" aria-live="polite">正在检查运行环境…</p>
        <ol id="env-steps" class="steps">
          <li data-step="node:check">检查 Node.js</li>
          <li data-step="trellis:check">检查 Trellis CLI</li>
          <li data-step="node:download">下载 Node.js</li>
          <li data-step="trellis:install">安装 Trellis CLI</li>
          <li data-step="ready">校验运行环境</li>
        </ol>
        <p id="env-error" class="error" role="alert" hidden></p>
        <div class="actions">
          <button id="env-install" type="button" hidden>安装运行环境</button>
          <button id="env-retry" type="button" class="secondary" hidden>重新检查</button>
        </div>
        <p class="hint">
          运行环境缺失时客户端会从国内镜像下载便携 Node.js，并把 Trellis CLI
          安装到客户端私有目录，不改动系统环境。
        </p>
      </section>

      <section id="login-panel" class="card" aria-labelledby="title" hidden>
        <div class="brand">
          <span class="mark" aria-hidden="true">T</span>
          <div>
            <p class="eyebrow">TRELLIS DESKTOP</p>
            <h1 id="title">登录团队看板</h1>
          </div>
        </div>
        <p id="status" class="status" role="status" aria-live="polite">正在读取上次登录设置…</p>

        <form id="login-form" novalidate>
          <label for="server-url">服务器地址</label>
          <input
            id="server-url"
            name="serverUrl"
            type="url"
            inputmode="url"
            placeholder="http://board.example.com 或 https://board.example.com"
            autocomplete="url"
            spellcheck="false"
            required
          />

          <label for="username">登录名</label>
          <input
            id="username"
            name="username"
            type="text"
            maxlength="64"
            autocomplete="username"
            spellcheck="false"
            required
          />

          <label for="password">密码</label>
          <input
            id="password"
            name="password"
            type="password"
            maxlength="1024"
            autocomplete="current-password"
            required
          />

          <p id="error" class="error" role="alert" hidden></p>
          <button id="submit" type="submit">登录</button>
        </form>

        <p class="hint">
          登录成功后会记住服务器地址、登录名和密码，下次打开可直接登录；密码不会写入日志。
        </p>
      </section>

      <footer>
        <span id="version"></span>
        <span id="config-path" class="path"></span>
      </footer>
    </main>
    <script src="setup.js"></script>
  </body>
</html>
