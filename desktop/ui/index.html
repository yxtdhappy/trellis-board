<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Trellis Board 登录</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="card" aria-labelledby="title">
        <div class="brand">
          <span class="mark" aria-hidden="true">T</span>
          <div>
            <p class="eyebrow">TRELLIS DESKTOP</p>
            <h1 id="title">登录团队看板</h1>
          </div>
        </div>
        <p id="status" class="status" role="status" aria-live="polite">正在读取上次登录设置…</p>

        <form id="login-form" novalidate>
          <label for="server-url">服务器地址</label>
          <input
            id="server-url"
            name="serverUrl"
            type="url"
            inputmode="url"
            placeholder="http://board.example.com 或 https://board.example.com"
            autocomplete="url"
            spellcheck="false"
            required
          />

          <label for="username">登录名</label>
          <input
            id="username"
            name="username"
            type="text"
            maxlength="64"
            autocomplete="username"
            spellcheck="false"
            required
          />

          <label for="password">密码</label>
          <input
            id="password"
            name="password"
            type="password"
            maxlength="1024"
            autocomplete="current-password"
            required
          />

          <p id="error" class="error" role="alert" hidden></p>
          <button id="submit" type="submit">登录</button>
        </form>

        <p class="hint">
          登录后会在当前窗口打开 Board。密码只交给本地后台进程完成认证，不写入配置或日志。
        </p>
      </section>

      <footer>
        <span id="version"></span>
        <span id="config-path" class="path"></span>
      </footer>
    </main>
    <script src="setup.js"></script>
  </body>
</html>
