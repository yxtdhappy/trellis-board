<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Trellis Board</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="shell">
      <header>
        <h1>Trellis Board</h1>
        <p id="status" class="status" role="status" aria-live="polite">正在读取本地配置…</p>
      </header>

      <section id="setup-panel" class="panel" hidden>
        <p class="lede">
          在浏览器登录 Board，于“团队管理 → 设备”生成一次性设备令牌，然后粘贴到下面；
          已注册协议处理程序时，页面上的“连接桌面客户端”会直接唤起本程序。
        </p>
        <form id="setup-form" novalidate>
          <label>
            <span>服务端地址</span>
            <input
              id="server-url"
              name="serverUrl"
              type="url"
              inputmode="url"
              placeholder="https://board.example.com"
              autocomplete="off"
              spellcheck="false"
              required
            />
          </label>
          <label>
            <span>设备名称</span>
            <input id="device-name" name="deviceName" type="text" maxlength="80" required />
          </label>
          <label>
            <span>设备令牌</span>
            <input
              id="enroll-token"
              name="token"
              type="password"
              autocomplete="off"
              spellcheck="false"
              minlength="32"
              required
            />
          </label>
          <div class="actions">
            <button id="submit" type="submit">用设备令牌注册并打开看板</button>
            <button id="open-login" type="button" class="secondary">从浏览器完成登录</button>
          </div>
        </form>
        <p id="error" class="error" role="alert" hidden></p>
        <p class="hint">
          设备令牌只用于本次注册，5 分钟内有效且只能使用一次；设备凭证由 Windows DPAPI 保护，
          不会写入本地存储或日志。
        </p>

        <details class="fallback">
          <summary>管理员兜底：使用配对码</summary>
          <p class="hint">
            配对码仅用于管理员排障，不作为桌面端默认注册方式；可在 Board 设备页生成。
          </p>
          <form id="pairing-form" novalidate>
            <label>
              <span>配对码</span>
              <input
                id="pairing-code"
                name="pairingCode"
                type="password"
                autocomplete="off"
                spellcheck="false"
                minlength="16"
                required
              />
            </label>
            <button id="pairing-submit" type="submit">使用配对码注册</button>
          </form>
        </details>
      </section>

      <section id="loading-panel" class="panel">
        <p>正在连接 Board 服务端…</p>
      </section>

      <footer>
        <span id="version"></span>
        <span id="config-path" class="path"></span>
      </footer>
    </main>
    <script src="setup.js"></script>
  </body>
</html>
