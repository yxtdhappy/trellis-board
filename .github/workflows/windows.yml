---
# yamllint disable rule:line-length
name: windows

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  node-tests:
    name: node tests (windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build web
        run: npm run build
      - name: Build desktop UI
        run: npm run build:desktop
      - name: Check package boundaries
        run: npm run check:boundaries
      - name: Server and web tests
        run: npm run test:all

  desktop-build:
    name: desktop build (windows)
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a  # v2.8.2
        with:
          workspaces: apps/desktop/src-tauri
      - name: Install tauri cli
        run: |
          npm install --prefix "$env:RUNNER_TEMP\tauri-cli" "@tauri-apps/cli@^2"
          "$env:RUNNER_TEMP\tauri-cli\node_modules\.bin" | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: Install build dependencies
        run: npm ci
      - name: Build web
        run: npm run build
      - name: Build desktop UI
        run: npm run build:desktop
      - name: Rust unit tests
        timeout-minutes: 25
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml
      - name: Prepare NSIS tool cache
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $toolsRoot = Join-Path $env:LOCALAPPDATA "tauri"
          $nsisRoot = Join-Path $toolsRoot "NSIS"
          $downloadRoot = Join-Path $env:RUNNER_TEMP "nsis-3.13"
          New-Item -ItemType Directory -Path $downloadRoot -Force | Out-Null

          gh release download nsis-3.13 `
            --repo tauri-apps/binary-releases `
            --pattern "nsis-3.13.zip" `
            --dir $downloadRoot
          if ($LASTEXITCODE -ne 0) { throw "failed to download NSIS 3.13" }

          $zip = Join-Path $downloadRoot "nsis-3.13.zip"
          $zipHash = (Get-FileHash -LiteralPath $zip -Algorithm SHA1).Hash
          if ($zipHash -ne "DB14F8AF2EA346B786C6AE19343F61AAF5E09B8E") {
            throw "NSIS zip SHA1 mismatch: $zipHash"
          }

          Expand-Archive -LiteralPath $zip -DestinationPath $toolsRoot -Force
          $extracted = Join-Path $toolsRoot "nsis-3.13"
          if (-not (Test-Path -LiteralPath $extracted -PathType Container)) {
            throw "missing extracted NSIS directory"
          }
          if (Test-Path -LiteralPath $nsisRoot) {
            Remove-Item -LiteralPath $nsisRoot -Recurse -Force
          }
          Move-Item -LiteralPath $extracted -Destination $nsisRoot

          gh release download nsis_tauri_utils-v0.5.3 `
            --repo tauri-apps/nsis-tauri-utils `
            --pattern "nsis_tauri_utils.dll" `
            --dir $downloadRoot
          if ($LASTEXITCODE -ne 0) { throw "failed to download NSIS Tauri utilities" }

          $plugin = Join-Path $downloadRoot "nsis_tauri_utils.dll"
          $pluginHash = (Get-FileHash -LiteralPath $plugin -Algorithm SHA1).Hash
          if ($pluginHash -ne "75197FEE3C6A814FE035788D1C34EAD39349B860") {
            throw "NSIS plugin SHA1 mismatch: $pluginHash"
          }
          $pluginRoot = Join-Path $nsisRoot "Plugins\x86-unicode\additional"
          New-Item -ItemType Directory -Path $pluginRoot -Force | Out-Null
          Copy-Item -LiteralPath $plugin -Destination (Join-Path $pluginRoot "nsis_tauri_utils.dll") -Force
      - name: Bundle desktop client
        working-directory: apps/desktop
        run: tauri build
      - name: Check artifacts
        run: |
          $release = "apps/desktop/src-tauri/target/release"
          $exe = Join-Path $release "trellis-board-client.exe"
          if (-not (Test-Path $exe)) { throw "missing $exe" }
          $pattern = Join-Path $release "bundle/nsis/*-setup.exe"
          $setup = Get-ChildItem $pattern
          if (-not $setup) { throw "missing NSIS installer" }
          Write-Host "client=$exe"
          Write-Host "installer=$($setup.FullName)"
      - name: Package portable client
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass `
            -File apps/desktop/package-portable.ps1
          if ($LASTEXITCODE -ne 0) {
            throw "portable packaging exited with $LASTEXITCODE"
          }
      - name: Portable package smoke test
        run: |
          $ErrorActionPreference = "Stop"
          $portableRoot = "apps/desktop/src-tauri/target/release/bundle/portable"
          $zip = Get-ChildItem (Join-Path $portableRoot "*.zip") | Select-Object -First 1
          if (-not $zip) { throw "missing portable ZIP" }
          $zipChecksum = Get-ChildItem (Join-Path $portableRoot "*.zip.sha256") |
            Select-Object -First 1
          if (-not $zipChecksum) { throw "missing portable ZIP checksum" }

          $actualZipHash = (Get-FileHash -LiteralPath $zip.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $expectedZipHash = ((Get-Content -LiteralPath $zipChecksum.FullName -Raw).Trim() -split '\s+')[0]
          if ($actualZipHash -ne $expectedZipHash) {
            throw "portable ZIP SHA256 mismatch"
          }

          $extractRoot = Join-Path $env:RUNNER_TEMP "portable smoke 中文"
          if (Test-Path -LiteralPath $extractRoot) {
            Remove-Item -LiteralPath $extractRoot -Recurse -Force
          }
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath $extractRoot
          $package = Get-ChildItem -LiteralPath $extractRoot -Directory | Select-Object -First 1
          if (-not $package) { throw "portable package directory missing" }

          foreach ($relative in @(
              "trellis-board-client.exe",
              "VERSION.txt",
              "SHA256SUMS.txt",
              "使用说明.txt"
            )) {
            $file = Join-Path $package.FullName $relative
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) {
              throw "portable package missing $relative"
            }
          }

          $checksumCount = 0
          foreach ($line in Get-Content -LiteralPath (Join-Path $package.FullName "SHA256SUMS.txt")) {
            if ($line -notmatch '^([0-9a-f]{64})  (.+)$') {
              throw "invalid SHA256SUMS line: $line"
            }
            $expected = $Matches[1]
            $relative = $Matches[2].Replace('/', '\')
            $actual = (Get-FileHash -LiteralPath (Join-Path $package.FullName $relative) `
              -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $expected) {
              throw "portable checksum mismatch: $relative"
            }
            $checksumCount++
          }
          if ($checksumCount -lt 2) { throw "portable checksum manifest is incomplete" }
      - name: Installer smoke test
        run: |
          $ErrorActionPreference = "Stop"
          $exe = "apps/desktop/src-tauri/target/release/trellis-board-client.exe"
          $hash = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash
          $installDir = Join-Path $env:LOCALAPPDATA "TrellisBoard"
          $script = "apps/desktop/install.ps1"
          $flags = "-NoProfile -ExecutionPolicy Bypass -File"
          if (Test-Path $installDir) {
            Remove-Item $installDir -Recurse -Force
          }
          $bad = "0" * 64
          powershell -NoProfile -ExecutionPolicy Bypass `
            -File $script -Source $exe -Checksum $bad -NoLaunch -Quiet
          if ($LASTEXITCODE -ne 2) {
            throw "bad checksum exit $LASTEXITCODE, want 2"
          }
          powershell -NoProfile -ExecutionPolicy Bypass `
            -File $script -Source $exe -Checksum $hash `
            -NoAutostart -NoLaunch -Quiet
          if ($LASTEXITCODE -ne 0) {
            throw "install exit $LASTEXITCODE"
          }
          $client = Join-Path $installDir "trellis-board-client.exe"
          if (-not (Test-Path $client)) { throw "client not installed" }
          powershell -NoProfile -ExecutionPolicy Bypass `
            -File $script -Uninstall -Quiet
          if ($LASTEXITCODE -ne 0) {
            throw "uninstall exit $LASTEXITCODE"
          }
          if (Test-Path $client) { throw "client not removed" }
      - name: Launch smoke test
        continue-on-error: true
        run: |
          $exe = "apps/desktop/src-tauri/target/release/trellis-board-client.exe"
          $env:TRELLIS_DESKTOP_HOME = Join-Path $env:TEMP "tb-smoke"
          $proc = Start-Process -FilePath $exe `
            -ArgumentList "--minimized" -PassThru
          Start-Sleep -Seconds 10
          if ($proc.HasExited) {
            throw "client exited with $($proc.ExitCode)"
          }
          Stop-Process -Id $proc.Id -Force
          $log = Join-Path $env:TEMP "tb-smoke/desktop.log"
          if (Test-Path $log) { Get-Content $log -Tail 20 }
      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: trellis-board-desktop-windows
          path: |
            apps/desktop/src-tauri/target/release/trellis-board-client.exe
            apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
            apps/desktop/src-tauri/target/release/bundle/portable/*.zip
            apps/desktop/src-tauri/target/release/bundle/portable/*.zip.sha256
          if-no-files-found: error
          retention-days: 14
