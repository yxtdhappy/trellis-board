---
# yamllint disable rule:line-length
name: windows

# 缓存只能被「当前 ref 或默认分支」的 run 复用：tag 推送的 run 落在 refs/tags/<tag> 作用域，
# 即使默认分支是 main 也读不到 refs/heads/main 的缓存（实测 "No cache found."），
# 所以 tag 推送不直接构建，而是转发一次 ref=main 的 workflow_dispatch，
# 由那次 run 检出 tag 的代码在 main 的缓存作用域里构建。

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "要构建并发布的 tag（如 v0.4.0），留空则按 main 当前提交构建、不发 release"
        required: false
        type: string
  push:
    tags:
      - "v*"

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  dispatch-main:
    name: dispatch build on main
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Dispatch the tagged build on main
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/workflows/windows.yml/dispatches" -f ref=main -f "inputs[release_tag]=${RELEASE_TAG}"

  node-tests:
    name: node tests (windows)
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ inputs.release_tag != '' && format('refs/tags/{0}', inputs.release_tag) || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build web
        run: npm run build
      - name: Build desktop UI
        run: npm run build:desktop
      - name: Check package boundaries
        run: npm run check:boundaries
      - name: Server and web tests
        run: npm run test:all

  desktop-build:
    name: desktop build (windows)
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ inputs.release_tag != '' && format('refs/tags/{0}', inputs.release_tag) || github.sha }}
      - name: Resolve release version
        env:
          RELEASE_TAG_INPUT: ${{ inputs.release_tag }}
        run: |
          $tag = $env:RELEASE_TAG_INPUT
          if ($tag) {
            if ($tag -notmatch '^v\d+\.\d+\.\d+$') {
              throw "release tag must look like v1.2.3: $tag"
            }
            $version = $tag.Substring(1)
            "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append
            "RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
            Write-Host "building version $version from tag $tag"
          } else {
            Write-Host "no release tag, building the checked-in version"
          }
      - name: Stamp version from tag
        if: env.RELEASE_VERSION != ''
        run: |
          $version = $env:RELEASE_VERSION
          $targets = @(
            @{ Path = 'apps/desktop/package.json'
               Pattern = '"version"\s*:\s*"[^"]+"'
               Replacement = '"version": "' + $version + '"' },
            @{ Path = 'apps/desktop/src-tauri/tauri.conf.json'
               Pattern = '"version"\s*:\s*"[^"]+"'
               Replacement = '"version": "' + $version + '"' },
            @{ Path = 'apps/desktop/src-tauri/Cargo.toml'
               Pattern = '(?m)^version = "[^"]+"'
               Replacement = 'version = "' + $version + '"' }
          )
          foreach ($target in $targets) {
            $text = Get-Content -LiteralPath $target.Path -Raw
            $updated = [regex]::Replace($text, $target.Pattern, $target.Replacement)
            $match = [regex]::Match($updated, $target.Pattern)
            if (-not $match.Success -or $match.Value -notmatch [regex]::Escape($version)) {
              throw "version not stamped in $($target.Path)"
            }
            if ($updated -ne $text) {
              Set-Content -LiteralPath $target.Path -Value $updated -NoNewline
            }
          }
          git diff --stat
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a  # v2.8.2
        with:
          workspaces: apps/desktop/src-tauri
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install tauri cli
        run: |
          npm install --prefix "$env:RUNNER_TEMP\tauri-cli" "@tauri-apps/cli@^2"
          "$env:RUNNER_TEMP\tauri-cli\node_modules\.bin" | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: Install build dependencies
        run: npm ci
      - name: Build web
        run: npm run build
      - name: Build desktop UI
        run: npm run build:desktop
      - name: Rust unit tests
        timeout-minutes: 25
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml
      - name: Bundle desktop client
        working-directory: apps/desktop
        run: tauri build
      - name: Check artifacts
        run: |
          $release = "apps/desktop/src-tauri/target/release"
          $exe = Join-Path $release "trellis-board-client.exe"
          if (-not (Test-Path $exe)) { throw "missing $exe" }
          if (Test-Path (Join-Path $release "bundle/nsis")) {
            throw "unexpected NSIS bundle output"
          }
          Write-Host "client=$exe"
      - name: Package portable client
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass `
            -File apps/desktop/package-portable.ps1
          if ($LASTEXITCODE -ne 0) {
            throw "portable packaging exited with $LASTEXITCODE"
          }
      - name: Portable package smoke test
        run: |
          $ErrorActionPreference = "Stop"
          $portableRoot = "apps/desktop/src-tauri/target/release/bundle/portable"
          $zip = Get-ChildItem (Join-Path $portableRoot "*.zip") | Select-Object -First 1
          if (-not $zip) { throw "missing portable ZIP" }
          $zipChecksum = Get-ChildItem (Join-Path $portableRoot "*.zip.sha256") |
            Select-Object -First 1
          if (-not $zipChecksum) { throw "missing portable ZIP checksum" }

          $actualZipHash = (Get-FileHash -LiteralPath $zip.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $expectedZipHash = ((Get-Content -LiteralPath $zipChecksum.FullName -Raw).Trim() -split '\s+')[0]
          if ($actualZipHash -ne $expectedZipHash) {
            throw "portable ZIP SHA256 mismatch"
          }

          $extractRoot = Join-Path $env:RUNNER_TEMP "portable smoke 中文"
          if (Test-Path -LiteralPath $extractRoot) {
            Remove-Item -LiteralPath $extractRoot -Recurse -Force
          }
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath $extractRoot
          $package = Get-ChildItem -LiteralPath $extractRoot -Directory | Select-Object -First 1
          if (-not $package) { throw "portable package directory missing" }

          if ($env:RELEASE_VERSION) {
            $expectedZip = "TrellisBoard_$($env:RELEASE_VERSION)_x64-portable.zip"
            if ($zip.Name -ne $expectedZip) {
              throw "portable ZIP is $($zip.Name), expected $expectedZip"
            }
            $versionLine = (Get-Content -LiteralPath (Join-Path $package.FullName "VERSION.txt") -Raw).Trim()
            if ($versionLine -ne "boardVersion=$($env:RELEASE_VERSION)") {
              throw "VERSION.txt is '$versionLine', expected boardVersion=$($env:RELEASE_VERSION)"
            }
          }

          foreach ($relative in @(
              "trellis-board-client.exe",
              "VERSION.txt",
              "SHA256SUMS.txt",
              "使用说明.txt"
            )) {
            $file = Join-Path $package.FullName $relative
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) {
              throw "portable package missing $relative"
            }
          }

          $checksumCount = 0
          foreach ($line in Get-Content -LiteralPath (Join-Path $package.FullName "SHA256SUMS.txt")) {
            if ($line -notmatch '^([0-9a-f]{64})  (.+)$') {
              throw "invalid SHA256SUMS line: $line"
            }
            $expected = $Matches[1]
            $relative = $Matches[2].Replace('/', '\')
            $actual = (Get-FileHash -LiteralPath (Join-Path $package.FullName $relative) `
              -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $expected) {
              throw "portable checksum mismatch: $relative"
            }
            $checksumCount++
          }
          if ($checksumCount -lt 2) { throw "portable checksum manifest is incomplete" }
      - name: Launch smoke test
        continue-on-error: true
        run: |
          $exe = "apps/desktop/src-tauri/target/release/trellis-board-client.exe"
          $env:TRELLIS_DESKTOP_HOME = Join-Path $env:TEMP "tb-smoke"
          $proc = Start-Process -FilePath $exe `
            -ArgumentList "--minimized" -PassThru
          Start-Sleep -Seconds 10
          if ($proc.HasExited) {
            throw "client exited with $($proc.ExitCode)"
          }
          Stop-Process -Id $proc.Id -Force
          $log = Join-Path $env:TEMP "tb-smoke/desktop.log"
          if (Test-Path $log) { Get-Content $log -Tail 20 }
      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: trellis-board-desktop-windows
          path: |
            apps/desktop/src-tauri/target/release/bundle/portable/*.zip
            apps/desktop/src-tauri/target/release/bundle/portable/*.zip.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Publish release assets
        if: env.RELEASE_TAG != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = $env:RELEASE_TAG

          $dir = "apps/desktop/src-tauri/target/release/bundle/portable"
          $assets = @(Get-ChildItem -LiteralPath $dir -File |
            Where-Object { $_.Name -match '\.zip(\.sha256)?$' } |
            ForEach-Object { $_.FullName })
          if ($assets.Count -ne 2) { throw "expected zip and sha256 in $dir, found $($assets.Count)" }

          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --target $env:GITHUB_SHA `
              --title "Trellis Board $tag" --generate-notes
            if ($LASTEXITCODE -ne 0) { throw "failed to create release $tag" }
          }
          gh release upload $tag @assets --clobber
          if ($LASTEXITCODE -ne 0) { throw "failed to upload release assets for $tag" }
