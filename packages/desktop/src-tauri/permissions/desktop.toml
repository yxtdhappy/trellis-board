# 本地登录页与远程 Board 使用分离的 capability。

[[permission]]
identifier = "allow-app-status"
description = "读取本地桌面客户端版本、上次服务端地址和 Agent 运行状态。"
commands.allow = ["app_status"]

[[permission]]
identifier = "allow-client-identity"
description = "当前已登录 Board 可读取桌面客户端的只读品牌名和版本号。"
commands.allow = ["client_identity"]

[[permission]]
identifier = "allow-update-status"
description = "当前已登录 Board 可读取缓存的客户端更新状态，不发起网络请求。"
commands.allow = ["update_status"]

[[permission]]
identifier = "allow-update-check"
description = "当前已登录 Board 可请求客户端检查更新服务器。"
commands.allow = ["update_check"]

[[permission]]
identifier = "allow-update-apply"
description = "当前已登录 Board 可下载、校验并安装客户端更新，随后重启。"
commands.allow = ["update_apply"]

[[permission]]
identifier = "allow-desktop-login"
description = "仅本地登录页向进程内 Agent 提交账号密码。"
commands.allow = ["desktop_login"]

[[permission]]
identifier = "allow-desktop-logout"
description = "当前 Board origin 可退出桌面登录并返回本地登录页。"
commands.allow = ["desktop_logout"]

[[permission]]
identifier = "allow-pick-local-project-folder"
description = "当前 Board origin 只能弹出系统目录选择器并拿到用户选中的本地项目根目录。"
commands.allow = ["pick_local_project_folder"]

[[permission]]
identifier = "allow-inspect-local-project"
description = "当前 Board origin 只能对用户刚选中的本地项目执行只读预检。"
commands.allow = ["inspect_local_project"]

[[permission]]
identifier = "allow-initialize-pending-project"
description = "当前 Board origin 只能初始化用户刚刚选择的本地项目。"
commands.allow = ["initialize_pending_project"]

[[permission]]
identifier = "allow-check-pending-project-push"
description = "当前 Board origin 只能检查用户刚刚选择的本地项目首次推送状态。"
commands.allow = ["check_pending_project_push"]

[[permission]]
identifier = "allow-commit-and-push-pending-project"
description = "当前 Board origin 只能对用户刚刚选择的本地项目提交并推送 Trellis 初始化文件。"
commands.allow = ["commit_and_push_pending_project"]

[[permission]]
identifier = "allow-preflight-pending-project"
description = "当前 Board origin 只能只读预检用户刚刚选择的本地项目，不得建立绑定。"
commands.allow = ["preflight_pending_project"]

[[permission]]
identifier = "allow-cancel-pending-project"
description = "当前 Board origin 只能清除用户刚刚选择的待接入项目路径。"
commands.allow = ["cancel_pending_project"]

[[permission]]
identifier = "allow-associate-pending-project"
description = "当前 Board origin 只能接入用户刚刚选择并完成预检的本地项目。"
commands.allow = ["associate_pending_project"]

[[permission]]
identifier = "allow-list-local-associations"
description = "当前 Board origin 可读取本地项目关联状态。"
commands.allow = ["list_local_associations"]

[[permission]]
identifier = "allow-list-worktree-status"
description = "当前 Board origin 可读取自动发现的 worktree 接入与可见性状态。"
commands.allow = ["list_worktree_status"]

[[permission]]
identifier = "allow-refresh-worktree-discovery"
description = "当前 Board origin 可触发一次 worktree 发现与状态重算。"
commands.allow = ["refresh_worktree_discovery"]

[[permission]]
identifier = "allow-retry-worktree-auto-attach"
description = "当前 Board origin 可重试指定 worktree 的自动接入。"
commands.allow = ["retry_worktree_auto_attach"]

[[permission]]
identifier = "allow-detach-local-association"
description = "当前 Board origin 可停止已批准关联的本地同步，并请求服务端权威解绑。"
commands.allow = ["detach_local_association"]

[[permission]]
identifier = "allow-inspect-associated-project-agents"
description = "当前 Board origin 可按已批准的任务空间关联只读检查本机编码 Agent。"
commands.allow = ["inspect_associated_project_agents"]

[[permission]]
identifier = "allow-initialize-associated-project-agents"
description = "当前 Board origin 可为已批准的任务空间关联追加本机编码 Agent。"
commands.allow = ["initialize_associated_project_agents"]

[[permission]]
identifier = "allow-sync-deferred-tasks"
description = "当前 Board origin 可为已关联任务空间显式上传本地待同步任务。"
commands.allow = ["sync_deferred_tasks"]

[[permission]]
identifier = "allow-list-task-ownership"
description = "当前 Board origin 可读取本地待确认归属的任务候选。"
commands.allow = ["list_task_ownership"]

[[permission]]
identifier = "allow-set-task-ownership"
description = "当前 Board 或本地控制窗口可批量写入任务分支归属或暂不处理。"
commands.allow = ["set_task_ownership"]

[[permission]]
identifier = "allow-desktop-sidecar-status"
description = "当前 Board origin 可读取客户端后台同步运行状态。"
commands.allow = ["desktop_sidecar_status"]

[[permission]]
identifier = "allow-live-control-get"
description = "当前 Board origin 读取当前待处理事件。"
commands.allow = ["live_control_pending"]

[[permission]]
identifier = "allow-handoff-notice-pending"
description = "当前 Board origin 读取本人任务认领后的非阻塞清理状态。"
commands.allow = ["handoff_notice_pending"]

[[permission]]
identifier = "allow-live-control-show"
description = "当前 Board origin 唤起待处理的实时同步确认弹窗。"
commands.allow = ["live_control_show"]

[[permission]]
identifier = "allow-live-control-decide"
description = "当前 Board origin 提交任务冲突处理动作。"
commands.allow = ["live_control_decide"]

[[permission]]
identifier = "allow-live-control-diff"
description = "当前 Board origin 读取冲突任务的本地与服务端内容。"
commands.allow = ["live_control_diff"]

[[permission]]
identifier = "allow-live-control-initial"
description = "当前 Board origin 处理已经明确接入后的首次同步差异。"
commands.allow = ["live_control_initial"]

[[permission]]
identifier = "allow-live-control-dismiss"
description = "当前 Board origin 关闭已读通知。"
commands.allow = ["live_control_dismiss"]

[[permission]]
identifier = "allow-live-task-download"
description = "当前 Board origin 可把已关联任务空间里未归档的任务下载为本机只读副本。"
commands.allow = ["live_task_download"]

[[permission]]
identifier = "allow-live-local-task-state"
description = "当前 Board origin 可读取已关联任务空间的本地任务状态（本地/只读/未下载）。"
commands.allow = ["live_local_task_state"]

[[permission]]
identifier = "allow-live-conflicts-show"
description = "当前 Board origin 可重新打开未处理的任务冲突确认弹窗。"
commands.allow = ["live_conflicts_show"]

[[permission]]
identifier = "allow-runtime-status"
description = "本地登录页可检查 Node.js 与 Trellis CLI 运行环境。"
commands.allow = ["runtime_status"]

[[permission]]
identifier = "allow-runtime-set-node-path"
description = "本地登录页可在环境检查时手动指定 node.exe 或它所在的目录。"
commands.allow = ["runtime_set_node_path"]

[[permission]]
identifier = "allow-runtime-install"
description = "本地登录页可在环境缺失时安装运行环境。"
commands.allow = ["runtime_install"]

[[permission]]
identifier = "allow-appearance-load"
description = "当前页面可读取本机外观偏好（主题与根字号，只读且不含敏感数据）。"
commands.allow = ["appearance_load"]

[[permission]]
identifier = "allow-appearance-save"
description = "当前已登录的 Board origin 可把主题与根字号写入本机外观偏好。"
commands.allow = ["appearance_save"]

[[permission]]
identifier = "allow-desktop-plugins-list"
description = "当前 Board origin 可读取本机插件清单与运行状态。"
commands.allow = ["desktop_plugins_list"]

[[permission]]
identifier = "allow-desktop-plugin-set-enabled"
description = "当前 Board origin 可启用或停用本机插件；停用最后一个插件会回收 Node 进程。"
commands.allow = ["desktop_plugin_set_enabled"]

[[permission]]
identifier = "allow-desktop-plugin-reorder"
description = "当前 Board origin 可调整本机插件的面板顺序。"
commands.allow = ["desktop_plugin_reorder"]

[[permission]]
identifier = "allow-desktop-plugin-logs"
description = "当前 Board origin 可读取本机插件最近的日志。"
commands.allow = ["desktop_plugin_logs"]

[[permission]]
identifier = "allow-desktop-plugin-panels"
description = "当前 Board origin 可读取本机插件面板与事件地址。"
commands.allow = ["desktop_plugin_panels"]

[[permission]]
identifier = "allow-desktop-plugin-request"
description = "当前 Board origin 可代表面板向本机插件发起请求（仅 loopback 宿主）。"
commands.allow = ["desktop_plugin_request"]

[[permission]]
identifier = "allow-desktop-plugin-asset"
description = "当前 Board origin 可读取本机插件面板的静态文本资源。"
commands.allow = ["desktop_plugin_asset"]

[[permission]]
identifier = "allow-take-pending-share-link"
description = "当前已登录 Board 可读取并清空暂存的任务分享目标，只含服务地址与任务定位参数。"
commands.allow = ["take_pending_share_link"]
